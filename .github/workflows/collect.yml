name: collect

# 予報と実測を取って data/ に追記し、public/data/ を作り直す。
#
# 01:00 JST  12UTC の予報、前日確定の実測、気象庁予報、派生ビルド
# 06:00 JST  朝の最新予報だけ更新。実測と派生は回さない
#
# 収集スクリプトは冪等なので、同じ時間帯に2回走っても行は増えない。
#
# 注意: GITHUB_TOKEN で push しても他のワークフローは起動しない。
# そのため Pages の配信をこのワークフローから直接呼ぶ。
# deploy-pages.yml の push トリガーだけに任せると、収集の結果が永久に公開されない。

on:
  schedule:
    # cron は UTC 指定。JST は +9 時間
    - cron: '0 16 * * *'   # 01:00 JST
    - cron: '0 21 * * *'   # 06:00 JST
  workflow_dispatch:
    inputs:
      full:
        description: '実測と派生ビルドも回す'
        type: boolean
        default: true
  # このワークフロー自体を直したときは、実際に動くか確かめる
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 依存ゼロなので install しない

      - name: 実測と派生も回すかを決める
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo '朝の回。予報のみ更新する' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 予報を取る
        run: node scripts/collect-forecast.js

      - name: 気象庁の府県天気予報を取る
        # 気象庁の JSON は公式 API ではない。落ちても全体は止めない
        continue-on-error: true
        run: node scripts/collect-jma-forecast.js

      - name: 実測を取る
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        run: node scripts/collect-observation.js

      - name: 派生データを作り直す
        if: steps.mode.outputs.full == 'true'
        run: node scripts/build-derived.js

      - name: 古い年のファイルを圧縮する
        if: steps.mode.outputs.full == 'true'
        run: node scripts/compress-old.js

      # 収集の状態を必ず1枚の JSON に残す。
      # このファイルは毎回変わるので、収集が空振りしてもコミットが立ち、
      # Pages の配信も必ず走る。日付が止まったままになることがなくなる。
      - name: 収集の状態を記録する
        if: always()
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/write-collect-status.js

      - name: 変更があればコミットする
        id: commit
        if: always()
        run: |
          set -x
          git status --porcelain data/ public/data/ > /tmp/changes.txt || true

          {
            echo '## 収集の結果'
            echo ''
            echo '### 変更されたファイル'
            echo '```'
            if [ -s /tmp/changes.txt ]; then head -n 40 /tmp/changes.txt; else echo '（なし）'; fi
            echo '```'
            echo ''
            echo '### 収集ログ（直近5件）'
            echo '```'
            tail -n 5 data/collect-log.ndjson 2>/dev/null || echo 'ログなし'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s /tmp/changes.txt ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '変更が1つも無い。収集が空振りしている可能性がある' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 途中で失敗していたら、作りかけのデータを公開してはいけない。
          # そのときは状態の記録だけをコミットして、何が起きたかを残す
          if [ "${{ job.status }}" = "success" ]; then
            git add data/ public/data/
          else
            echo '前の手順が失敗している。状態の記録だけをコミットする' >> "$GITHUB_STEP_SUMMARY"
            git add public/data/collect-status.json
          fi

          # 改行だけの差分は add で正規化されて消える。その場合はここで止める
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '中身の変わったファイルは無かった' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "データを更新 $(TZ=Asia/Tokyo date +%Y-%m-%d' '%H:%M)"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "コミットした: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # 収集がコミットしたら、そのまま Pages へ配信する。
  # GITHUB_TOKEN の push は他のワークフローを起動しないので、ここから呼ぶ必要がある
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
