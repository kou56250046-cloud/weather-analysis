name: deploy-pages

# public/ を GitHub Pages へ配信する。
# データが変わったときだけ回す。コードだけ直したときも回す。

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # collect.yml から呼ばれる。GITHUB_TOKEN の push は他のワークフローを
  # 起動しないので、収集の結果を公開するにはこの経路が要る
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は1本ずつ。走行中のものは止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 既定では「起動のきっかけになったコミット」を取る。
      # collect.yml から呼ばれるとき、収集がその直前に作ったコミットは
      # まだそこに含まれていないので、明示的にブランチの先頭を取る。
      # これをしないと、収集した内容が1回ぶん遅れて公開される
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
